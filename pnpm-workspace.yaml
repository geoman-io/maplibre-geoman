packages:
  - apps/dev
  - packages/core
  - packages/maplibre
  - packages/mapbox

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  # maplibre-gl 6.11.0 is newer than the 7-day minimumReleaseAge window.
  - maplibre-gl@6.11.0
  - turbo@2.11.2
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'

pmOnFail: ignore

overrides:
  ajv: 6.14.0
  # GHSA-w27v-7q3p-w38r / GHSA-4vpr-x523-8j87 (via vite-svg-loader)
  svgo: ^3.3.5

allowBuilds:
  '@parcel/watcher': true
