packages:
  - apps/dev
  - packages/core
  - packages/maplibre
  - packages/mapbox

minimumReleaseAge: 10080

# Transitive dev-only dependencies pinned past published advisories, so `pnpm audit`
# (run by the Security Scan CI job) stays clean. Each pin stays within the version's
# resolved major, so it is a patch-level lift only. Drop an entry once the direct
# dependency that pulls it in ships the fix itself.
overrides:
  ajv: 6.14.0
  brace-expansion: '>=5.0.9'
  immutable: '>=5.1.8'
  nanoid: '>=3.3.18'
  postcss: '>=8.5.23'
  svgo: '>=3.3.4'

allowBuilds:
  '@parcel/watcher': true
  svelte-preprocess: true
